<script>'use strict';
/* Pocket Slugger — a small, ad-free, offline baseball game.
   No network requests, no tracking. Progress is stored only in this browser (localStorage). */
(function () {
  // ================= Helpers =================
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const rad = d => d * Math.PI / 180;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const lerpPt = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) });
  const hArc = (u, h0, h1, peak) => lerp(h0, h1, u) + 4 * peak * u * (1 - u);
  function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function hashStr(s) { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || 'th');
  const baseName = b => b === 4 ? 'home' : ordinal(b);

  // Safe DOM builder: never uses innerHTML, so names typed by players can't inject code.
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') el.value = v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.appendChild(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  // ================= Data =================
  const FIRST = ['Ace', 'Mo', 'Jada', 'Kenji', 'Lucia', 'Theo', 'Amara', 'Diego', 'Priya', 'Sam', 'Noor', 'Eli', 'Zoe', 'Malik', 'Hana', 'Leo', 'Ivy', 'Omar', 'Rosa', 'Finn', 'Kai', 'Maya', 'Jonah', 'Aisha', 'Ruby', 'Mateo', 'Nia', 'Oscar', 'Tess', 'Ravi', 'June', 'Felix', 'Lena', 'Arlo', 'Sofia', 'Dev', 'Gus', 'Wren', 'Nico', 'Tali', 'Kofi', 'Mei', 'Ana', 'Yusuf', 'Quinn', 'Luca'];
  const LAST = ['Rivera', 'Kim', 'Okafor', 'Nguyen', 'Silva', 'Patel', 'Johnson', 'Haddad', 'Lopez', 'Sato', 'Bauer', 'Mensah', 'Cohen', 'Garcia', 'Ali', 'Novak', 'Reyes', 'Park', 'Brooks', 'Diaz', 'Fox', 'Chen', 'Moreau', 'Singh', 'Tran', 'Ortiz', 'Hale', 'Dube', 'Lund', 'Vega', 'Adeyemi', 'Ito', 'Kowalski', 'Begay'];
  const CPU_TEAMS = [
    { name: 'Riverside Raccoons', color: '#5b6170' }, { name: 'Harbor Otters', color: '#8a5a2b' },
    { name: 'Desert Comets', color: '#e07a1f' }, { name: 'Maple Moose', color: '#a52a2a' },
    { name: 'Glacier Narwhals', color: '#2a7fb8' }, { name: 'Canyon Coyotes', color: '#b5651d' },
    { name: 'Thunder Turtles', color: '#2e8b57' }, { name: 'Prairie Fireflies', color: '#b8960b' },
    { name: 'Bayou Gators', color: '#4b6b2a' }, { name: 'Summit Yetis', color: '#5b6fd6' },
    { name: 'Lighthouse Puffins', color: '#333f50' }, { name: 'Volcano Geckos', color: '#c2410c' }];
  const COLORS = ['#d7263d', '#1b4fd8', '#0f9d58', '#f28c28', '#7b2cbf', '#111827', '#00a6a6', '#e83f8b', '#8d6e63', '#d4a106'];
  const SKIN = ['#f6d5b8', '#eabf98', '#d19a6a', '#a8714a', '#7a4e2d', '#5a3a22'];
  const POS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];
  const POS_NAME = { C: 'Catcher', '1B': 'First Base', '2B': 'Second Base', '3B': 'Third Base', SS: 'Shortstop', LF: 'Left Field', CF: 'Center Field', RF: 'Right Field', DH: 'Designated Hitter', P: 'Pitcher' };
  const PITCHES = {
    FB: { name: 'Fastball', speed: 1.0, bx: 0.0, by: -0.15 },
    CB: { name: 'Curve', speed: 0.8, bx: 0.55, by: -1.5 },
    SL: { name: 'Slider', speed: 0.88, bx: 1.0, by: -0.45 },
    CH: { name: 'Change-up', speed: 0.76, bx: -0.35, by: -0.75 }
  };
  const PITCH_ORDER = ['FB', 'CB', 'SL', 'CH'];
  const STATS_B = ['pow', 'con', 'spd', 'fld'];
  const STATS_P = ['vel', 'ctl', 'brk'];
  const STAT_LABEL = { pow: 'Power', con: 'Contact', spd: 'Speed', fld: 'Fielding', vel: 'Velocity', ctl: 'Control', brk: 'Break' };
  const DIFF = {
    easy: { base: 2.5, bonus: -1.5, label: 'Easy', mult: 1 },
    medium: { base: 4.5, bonus: 0, label: 'Medium', mult: 1.5 },
    hard: { base: 5.5, bonus: 0.8, label: 'Hard', mult: 2 }

  const upgradeCost = lvl => 20 + lvl * 15;

  // Field geometry, in feet. Home plate at (0,0); +y points to center field; +x toward right field.
  const BASES = [{ x: 0, y: 0 }, { x: 63.64, y: 63.64 }, { x: 0, y: 127.28 }, { x: -63.64, y: 63.64 }];
  const FIELD_POS = { P: { x: 0, y: 60.5 }, C: { x: 0, y: -4 }, '1B': { x: 62, y: 92 }, '2B': { x: 30, y: 140 }, SS: { x: -30, y: 140 }, '3B': { x: -62, y: 92 }, LF: { x: -145, y: 235 }, CF: { x: 0, y: 285 }, RF: { x: 145, y: 235 } };
  const fenceDist = a => 330 - 40 * Math.pow(Math.min(1, Math.abs(a) / 45), 2); // 290 ft down the lines, 330 to center

  // ================= Save data =================
  const SAVE_KEY = 'pocketSlugger.v1';
  function uniqueName(used) { for (let i = 0; i < 60; i++) { const n = pick(FIRST) + ' ' + pick(LAST); if (!used.has(n)) { used.add(n); return n; } } return 'Player ' + (used.size + 1); }
  function makeAbbr(name) { const w = (String(name).trim().split(/\s+/).pop() || '').replace(/[^A-Za-z0-9]/g, ''); return (w.slice(0, 3) || 'YOU').toUpperCase(); }
  function makeTeam(base, spread, meta) {
    const used = new Set();
    const st = () => clamp(Math.round(base + rnd(-spread, spread)), 1, 10);
    const batters = POS.map(pos => ({ name: uniqueName(used), pos, bats: Math.random() < 0.72 ? 'R' : 'L', pow: st(), con: st(), spd: st(), fld: st() }));
    const pitcher = { name: uniqueName(used), throws: Math.random() < 0.75 ? 'R' : 'L', vel: st(), ctl: st(), brk: st() };
    return { name: meta.name, abbr: makeAbbr(meta.name), color: meta.color, batters, pitcher };
  }
  function defaultSave() {
    return { v: 1, team: makeTeam(4, 1.5, { name: 'Backyard Bombers', color: '#d7263d' }), coins: 150, record: { w: 0, l: 0, t: 0 }, settings: { help: 'rookie', sound: true }, p2: { name: 'Player 2 Pirates', color: '#1b4fd8' } };
  }
  const cleanStr = (s, def, max) => (typeof s === 'string' && s.trim()) ? s.replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, max || 18) : def;
  const cleanStat = v => { v = Math.round(Number(v)); return Number.isFinite(v) ? clamp(v, 1, 10) : 3; };
  const cleanColor = (c, def) => (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) ? c : def;
  function sanitizeSave(o) {
    if (!o || typeof o !== 'object' || !o.team || typeof o.team !== 'object') return null;
    const d = defaultSave(), t = o.team;
    const team = { name: cleanStr(t.name, d.team.name, 22), color: cleanColor(t.color, d.team.color), batters: [], pitcher: null };
    team.abbr = makeAbbr(team.name);
    for (let i = 0; i < 9; i++) {
      const b = (Array.isArray(t.batters) && t.batters[i] && typeof t.batters[i] === 'object') ? t.batters[i] : d.team.batters[i];
      team.batters.push({ name: cleanStr(b.name, d.team.batters[i].name), pos: POS[i], bats: b.bats === 'L' ? 'L' : 'R', pow: cleanStat(b.pow), con: cleanStat(b.con), spd: cleanStat(b.spd), fld: cleanStat(b.fld) });
    }
    const p = (t.pitcher && typeof t.pitcher === 'object') ? t.pitcher : d.team.pitcher;
    team.pitcher = { name: cleanStr(p.name, d.team.pitcher.name), throws: p.throws === 'L' ? 'L' : 'R', vel: cleanStat(p.vel), ctl: cleanStat(p.ctl), brk: cleanStat(p.brk) };
    const r = (o.record && typeof o.record === 'object') ? o.record : {};
    const ci = v => clamp(Math.floor(Number(v)) || 0, 0, 999999);
    const s = (o.settings && typeof o.settings === 'object') ? o.settings : {};
    const p2 = (o.p2 && typeof o.p2 === 'object') ? o.p2 : {};
    return { v: 1, team, coins: ci(o.coins), record: { w: ci(r.w), l: ci(r.l), t: ci(r.t) }, settings: { help: s.help === 'pro' ? 'pro' : 'rookie', sound: s.sound !== false }, p2: { name: cleanStr(p2.name, d.p2.name, 22), color: cleanColor(p2.color, d.p2.color) } };
  }
  function loadSave() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const s = sanitizeSave(JSON.parse(raw)); if (s) return s; } } catch (e) { /* storage unavailable */ }
    return defaultSave();
  }
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }
  function exportCode() { return 'PS1-' + btoa(unescape(encodeURIComponent(JSON.stringify(save)))); }
  function importCode(code) {
    try {
      code = String(code).replace(/\s+/g, '');
      if (!code.startsWith('PS1-') || code.length > 20000) return false;
      const s = sanitizeSave(JSON.parse(decodeURIComponent(escape(atob(code.slice(4))))));
      if (!s) return false;

    } catch (e) { return false; }
  }
  let save = loadSave();
  persist();
  const kidMode = () => save.settings.help !== 'pro';

  // ================= Sound (generated, no files) =================
  const Sound = {
    ctx: null,
    unlock() {
      if (!this.ctx) { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { /* no audio */ } }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    ok() { return !!this.ctx && save.settings.sound && !testMode; },
    tone(freq, dur, type, vol, slideTo) {
      if (!this.ok()) return;

    noise(dur, vol, freq, q, attack) {
      if (!this.ok()) return;

      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;

    crack() { this.noise(0.09, 0.6, 2500, 0.8); this.tone(900, 0.06, 'square', 0.07, 300); },
    pop() { this.noise(0.06, 0.35, 600, 1); this.tone(140, 0.08, 'sine', 0.22); },
    whiff() { this.noise(0.16, 0.1, 450, 0.6, 0.05); },
    cheer() { this.noise(1.8, 0.16, 1400, 0.35, 0.35); },
    click() { this.tone(700, 0.04, 'triangle', 0.06); },
    good() { this.tone(660, 0.08, 'triangle', 0.09); setTimeout(() => this.tone(990, 0.12, 'triangle', 0.09), 80); },
    bad() { this.tone(240, 0.22, 'sawtooth', 0.05, 120); },
    coin() { this.tone(988, 0.06, 'square', 0.05); setTimeout(() => this.tone(1319, 0.12, 'square', 0.05), 60); }
  };

  // ================= Canvas =================
  const W = 1000, H = 700;
  const FONT = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1, offX = 0, offY = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);

  window.addEventListener('resize', resize);
  const toV = e => ({ x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale });

  // drawing primitives
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }
  function rrPath(x, y, w, hh, r) { r = Math.min(r, w / 2, hh / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    showScreen(h('div', { class: 'card stack' },
      h('h2', { text: title, style: { fontSize: '36px', textAlign: 'center' } }),
      lineScoreTable(),
      vs ? h('div', { class: 'stack', style: { gap: '2px' } }, h('h3', { text: 'Coins earned' }), ...rewards.map(r => h('div', { class: 'reward' }, h('span', { text: r[0] }), h('b', { text: '+' + r[1] }))),
        h('div', { class: 'reward' }, h('b', { text: 'Total' }), h('b', { class: 'coins', text: '🪙 +' + total }))) : null,
      vs && !won ? h('div', { class: 'muted', text: 'Tip: spend coins on Contact and Power to hit better, or try Easy mode.' }) : null,
      h('div', { class: 'row', style: { justifyContent: 'center' } },
        h('button', { class: 'btn green', onclick: () => startGame(Object.assign({}, opts, { userHome: Math.random() < 0.5 })) }, 'Play again'),
        h('button', { class: 'btn blue', onclick: showTeam }, '🧢 My Team'),
        h('button', { class: 'btn gray', onclick: showTitle }, 'Menu'))));
  }

  // ================= Main loop =================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    const dts = testMode && window.__slugger && window.__slugger.speed ? dt * window.__slugger.speed : dt;
    if (G && !G.paused && G.phase !== 'over') { update(dts); syncUI(false); }
    render();
    requestAnimationFrame(frame);
  }
  resize();
  showTitle();
  requestAnimationFrame(frame);

  // Offline support: register the service worker only when served over https (e.g. GitHub Pages).
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline caching unavailable */ }); });
  }

  // Test hook (only with ?test in the URL): simulate computer-vs-computer games quickly.
  if (testMode) {
    window.__slugger = {
      simulate(n, innings, diff, simHuman, help) {
        const out = [];
        if (help) save.settings.help = help;
        for (let g = 0; g < n; g++) {
          G = newGame({ mode: 'cpu', innings: innings || 9, diff: diff || 'medium', userHome: false, auto: true, simHuman });
          banner('', '', 0.01, startAtBat);
          let steps = 0;
          while (G.phase !== 'over' && steps < 400000) { update(1 / 30); steps++; }
          out.push({ tally: G.tally, score: G.score.slice(), stats: G.stats, innings: G.inning, steps, over: G.phase === 'over' });
        }
        G = null; return out;
      },
      contactStats(n, help) {
        // distribution of outcomes for a given swing timing error (human batter), using the real contact model
        save.settings.help = help || 'rookie';
        G = newGame({ mode: 'cpu', innings: 3, diff: 'medium', userHome: false }); G.teams[1].human = false;
        const res = { whiff: 0, contact: 0, la: [], ev: [] };
        for (let i = 0; i < n; i++) {
          G.pitch = botPitch(); G.swing = null; G.pitch.t = G.pitch.T;
          doSwing({ e: gauss() * 0.06, cx: G.pitch.actual.x, cy: G.pitch.actual.y });
          if (G.swing.contact) { res.contact++; res.la.push(G.swing.bb.la); res.ev.push(G.swing.bb.ev); } else res.whiff++;
        }
        G = null; return res;
      },
      state: () => G,
      start: o => startGame(o),
      tap: (x, y) => onTap({ x, y }),
      save: () => save
    };
  }
})();
</script>
</body>
</html>
