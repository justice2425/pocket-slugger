  for (let s = 4; s <= sMax && !fielded; s += 2) {
    const pt = { x: dir.x * s, y: dir.y * s }, tb = tAt(s);
    for (const pos of inf) {
      const f = fielderStats(pos);
      const tf = (pos === 'P' && !bb.bunt ? 0.5 : 0.35) + dist(FP[pos], pt) / (f.spd * (bb.bunt ? 1 : 0.68));
      if (tf <= tb + 0.05) { fielded = { pos, f, pt, t: Math.max(tb, tf) }; break; }

  if (!fielded && sStop <= 160) {
    const pt = { x: dir.x * sStop, y: dir.y * sStop };
    for (const pos of ['P', '3B', 'SS', '2B', '1B', 'C']) {
      const f = fielderStats(pos), t = Math.max(0.35 + dist(FP[pos], pt) / f.spd, tAt(sStop));
      if (!fielded || t < fielded.t) fielded = { pos, f, pt, t };
    }
  }
  if (!fielded) {
    const sEnd = Math.min(sStop, fenceDist(bb.spray) - 4);
    let of = null;
    for (let s = 150; s <= sEnd && !of; s += 3) {
      const pt = { x: dir.x * s, y: dir.y * s }, tb = tAt(s);
      for (const pos of ['LF', 'CF', 'RF']) {
        const f = fielderStats(pos), tf = 0.35 + dist(FP[pos], pt) / f.spd;
        if (tf <= tb + 0.1) { of = { pos, f, pt, t: Math.max(tf, tb) }; break; }
      }
    }
    if (!of) {
      const pt = { x: dir.x * sEnd, y: dir.y * sEnd };
      for (const pos of ['LF', 'CF', 'RF']) {
        const f = fielderStats(pos), t = Math.max(0.35 + dist(FP[pos], pt) / f.spd, tAt(sEnd));
        if (!of || t < of.t) of = { pos, f, pt, t };
      }
    }
    return yield* hitRunning({ P: of.pt, tRet: of.t + 0.3, fid: 'F_' + of.pos, f: of.f, ballTws: [ballTo(of.pt, 0, of.t, 1.5, 0, 1)], elapsed: 0, preEvents: [{ t: 0.4, crowd: ['cheer', 0.3] }] });
  }
  return yield* groundPlay(fielded, !!bb.bunt);
}

// ---------- ground balls: choose where to throw ----------
function* groundPlay(fd, bunt) {
  const off = offTeam(), def = defTeam(), batter = curBatter();
  const P = fd.pt, f = fd.f, fid = 'F_' + fd.pos;
  const forced = [!!G.bases[0], !!G.bases[0] && !!G.bases[1], !!G.bases[0] && !!G.bases[1] && !!G.bases[2]];
  const runners = [{ id: 'R0', from: 0, to: 1, pl: batter, t: 0.9 + 90 / runSpeed(batter, off), forced: true }];
  const dest = [0, 0, 0];
  for (let i = 2; i >= 0; i--) {
    const r = G.bases[i]; if (!r) continue;
    let to = i + 1;
    if (forced[i]) to = i + 2;
    else if (i === 2 && G.outs < 2 && !bunt && Math.random() < 0.4 + 0.03 * r.spd) to = 4;
    else if (i === 1 && (!G.bases[2] || dest[2] === 4) && (bunt || Math.random() < 0.55)) to = 3;
    dest[i] = to;
    const head = G.headStart === i + 1 ? -0.5 : 0.25;
    runners.push({ id: 'R' + (i + 1), from: i + 1, to, pl: r, t: head + 90 * (to - (i + 1)) / runSpeed(r, off), forced: forced[i] });
  }
  // Stage A: the ball goes to the fielder while the runners take off
  const tws = [ballTo(P, 0, fd.t, bunt ? 0.8 : 1.5, 1, 1), moveTo(fid, P, 0.3, fd.t - 0.02)];
  for (const r of runners) if (r.to > r.from) {
    const start = r.from === 0 ? 0.9 : 0.1, frac = clamp((fd.t - start) / Math.max(0.1, r.t - start), 0, 0.85);
    if (frac > 0) tws.push(moveTo(r.id, lerpPt(BASES[r.from], BASES[r.from + 1 > 3 ? 0 : r.from + 1], Math.min(frac * (r.to - r.from), 0.85)), start, fd.t));
  }
  yield anim(tws, fd.t + 0.05, [{ t: fd.t, sound: 'pop' }]);

  // Throw options: any base a runner is heading to
  const opts = runners.filter(r => r.to > r.from).map(r => {
    const bp = BASES[r.to % 4], d = dist(P, bp), self = d < 28;
    const tThrow = fd.t + (self ? d / f.spd + 0.1 : 0.45 + d / f.arm) + (r.forced ? 0 : 0.2);
    return { r, base: r.to, tThrow, self, margin: r.t - tThrow };
  });
  let ch;
  const best = () => opts.filter(o => o.margin > 0.45).sort((a, b) => b.base - a.base)[0] || opts.slice().sort((a, b) => b.margin - a.margin)[0];
  if (def.human && opts.length > 1) {
    const base = yield { prompt: { kind: 'throwChoice', title: 'Where do you throw?', options: opts.map(o => ({ base: o.base })).sort((a, b) => b.base - a.base) } };
    ch = opts.find(o => o.base === base) || best();
  } else ch = def.human ? opts[0] : best();
  let out;
  if (ch.margin > 0.35) out = true;
  else if (ch.margin < -0.35) out = false;
  else {
    let p = clamp(0.5 + ch.margin * 1.4, 0.05, 0.95);
    if (def.human) { const s = yield promptTiming(fid, 'THROW!'); p = clamp(0.12 + 0.8 * s + ch.margin * 0.5, 0.03, 0.97); }
    out = Math.random() < p;
  }
  // Double play? After a force out somewhere else, relay to first.
  let dp = false;
  const bat = runners[0];
  if (out && ch.base !== 1 && ch.r.forced && G.outs + 1 < 3) {
    const pivot = fielderStats(ch.base === 2 ? (['SS', '3B', 'P'].includes(fd.pos) ? '2B' : 'SS') : ch.base === 3 ? '3B' : 'C');
    const tRelay = ch.tThrow + 0.8 + dist(BASES[ch.base % 4], BASES[1]) / pivot.arm, m2 = bat.t - tRelay;
    if (m2 > 0.3) dp = true;
    else if (m2 > -0.3) {
      let p = clamp(0.4 + m2 * 1.3, 0.05, 0.95);
      if (def.human) { const s = yield promptTiming(coverFor(ch.base), 'TURN TWO!'); p = clamp(0.1 + 0.8 * s + m2 * 0.5, 0.03, 0.97); }
      dp = Math.random() < p;
    }
  }
  // Stage B: the throw(s)
  const tws2 = [], ev2 = [];
  const bp = BASES[ch.base % 4], tOff = fd.t;
  let tArr = Math.max(0.25, ch.tThrow - tOff);
  let tR = Math.max(0.15, ch.r.t - tOff);
  if (out) tArr = Math.min(tArr, tR - 0.12); else tR = Math.min(tR, tArr - 0.12);
  tArr = Math.max(0.2, tArr); tR = Math.max(0.15, tR);
  if (ch.self) { tws2.push(moveTo(fid, bp, 0, tArr)); tws2.push(ballTo(bp, 0, tArr, 0, 4, 4)); }
  else {
    tws2.push(ballTo(bp, Math.min(0.3, tArr - 0.1), tArr, 3, 4, 4));
    const cov = coverFor(ch.base) === fid ? (ch.base === 1 ? 'F_P' : 'F_2B') : coverFor(ch.base);
    tws2.push(moveTo(cov, bp, 0, Math.min(0.6, tArr)));
  }
  const close = Math.abs(ch.margin) < 0.35;
  const tCall = Math.max(tArr, tR) + 0.02;
  ev2.push(...callEvents(tCall, !out, bp, ch.r.id));
  if (close && ch.r.id !== 'R0') ev2.push({ t: Math.max(0, tR - 0.3), slide: ch.r.id });
  let slow = close ? [tCall - 0.5, tCall + 0.12] : null;
  const res = { outs: out ? 1 : 0, runs: 0, bases: [null, null, null], hit: 0 };
  let outTime = out ? tCall : Infinity;
  if (dp) {
    const tDP = tCall + 0.7, tB = Math.max(tDP + 0.12, bat.t - tOff);
    tws2.push(ballTo(BASES[1], tCall + 0.1, tDP, 3, 4, 4)); tws2.push(moveTo('F_1B', BASES[1], 0, 0.6));
    ev2.push(...callEvents(tDP, false, BASES[1], 'R0'));
    tws2.push(moveTo('R0', BASES[1], 0, tB));
    res.outs = 2; outTime = tDP;
  } else if (ch.r.id !== 'R0') tws2.push(moveTo('R0', BASES[1], 0, Math.max(0.15, bat.t - tOff)));
  else tws2.push(moveTo('R0', BASES[1], 0, tR));
  for (const r of runners) {
    if (r === ch.r && out) continue;
    if (r.id === 'R0' && dp) continue;
    if (r.id === 'R0') { res.bases[0] = batter; continue; }
    const tw = r === ch.r ? moveTo(r.id, bp, 0, tR) : runTw(r.id, r.from, r.to, 0.05, runSpeed(r.pl, off));
    if (tw) tws2.push(tw);
    if (r.to === 4) { res.runs++; r.scoreT = tw ? tw.t1 : 0; ev2.push({ t: r.scoreT, hide: r.id, text: 'RUN!', at: BASES[0], color: '#ffd166' }); }
    else res.bases[r.to - 1] = r.pl;
  }
  if (G.outs + res.outs >= 3) {
    const forceOut = ch.r.forced || dp;
    if (forceOut) res.runs = 0;
    else res.runs = runners.filter(r => r.to === 4 && r !== ch.r && r.scoreT != null && r.scoreT < outTime).length;
  }
  if (dp) { res.text = 'DOUBLE PLAY!'; res.color = '#ff8a8a'; }
  else if (ch.base === 1) {
    if (out) res.text = bunt && runners.length > 1 ? 'SACRIFICE BUNT!' : 'GROUND OUT';
    else { res.text = bunt ? 'BUNT SINGLE!' : 'INFIELD HIT!'; res.hit = 1; }
    if (out && bunt && runners.length > 1) res.sub = 'The runner moves up — nice sacrifice!';
  } else res.text = out ? "FIELDER'S CHOICE" : 'EVERYONE’S SAFE!';
  yield anim(tws2, maxT(tws2) + 0.5, ev2, slow);
  return res;
}

// ---------- hits: runners advance; players can send runners and pick where to throw ----------
function* hitRunning(c) {
  const off = offTeam(), def = defTeam(), batter = curBatter();
  const el = c.elapsed || 0;
  const thr = n => dist(c.P, BASES[n % 4]) / c.f.arm + 0.3 + (n === 4 ? 1.2 : n >= 2 ? 1.7 + (n >= 3 ? 0.6 : 0) : 0);
  const head = from => from === 0 ? 0.7 : (G.headStart === from ? -0.5 : 0.3);
  const tRun = (pl, from, n) => head(from) + 90 * (n - from) / runSpeed(pl, off) + 0.1 * Math.max(0, n - from - 1) - el;
  const margin = (pl, from, n) => (c.tRet + thr(n)) - tRun(pl, from, n);
  // batter first
  let k = 1;
  while (k < 3 && margin(batter, 0, k + 1) > 0.25) k++;
  const plan = [{ id: 'R0', from: 0, pl: batter, safe: k }];
  let behind = k;
  for (let i = 0; i < 3; i++) {
    const r = G.bases[i]; if (!r) continue;
    const from = i + 1, min = Math.min(4, Math.max(from + 1, behind + 1));

  // can anyone try for one more base?

    const ahead = plan.slice(j + 1).find(q => q.safe < 4);
    if (ahead && ahead.safe <= n) continue;
    const delta = margin(p.pl, p.from, n);
    if (delta > -0.55) { p.stretch = n; p.delta = delta; }
  }
  const tws = c.ballTws.slice(), ev = (c.preEvents || []).slice();
  tws.push(moveTo(c.fid, c.P, 0.05, Math.max(0.3, c.tRet - 0.3)));

    const tw = runTw(p.id, p.from, p.safe, p.from === 0 ? Math.max(0, 0.9 - el) : 0, runSpeed(p.pl, off));

      const title = key.from === 0 ? (key.stretch === 4 ? 'Try for HOME?!' : `Go for ${ordinal(key.stretch)}?`) : (key.stretch === 4 ? 'Send the runner HOME?' : `Send the runner to ${ordinal(key.stretch)}?`);
      const go = yield { prompt: { kind: 'choice', title, sub: p0 > 0.6 ? 'Good chance!' : p0 > 0.4 ? 'Close call…' : 'Risky!' } };
      if (go) goers.push(key);
      for (const p of cands) if (p !== key && p.delta > 0.05) goers.push(p);
    } else for (const p of cands) { const p0 = clamp(0.5 + p.delta * 1.5, 0.08, 0.92); if (p0 > 0.5 + Math.random() * 0.15) goers.push(p); }

    for (let j = plan.length - 1; j >= 0; j--) {
      const p = plan[j]; if (!goers.includes(p)) continue;

    if (def.human && goers.length > 1) {
      const base = yield { prompt: { kind: 'throwChoice', title: 'Throw to which base?', options: goers.map(g => ({ base: g.stretch })).sort((a, b) => b.base - a.base) } };
      target = goers.find(g => g.stretch === base) || goers[0];
    } else if (def.human) target = goers[0];
    else target = goers.reduce((a, b) => (b.delta < a.delta ? b : a));
    let pSafe = clamp(0.5 + target.delta * 1.5, 0.08, 0.92);
    if (def.human) { const s = yield promptTiming(c.fid, target.stretch === 4 ? 'THROW HOME!' : `THROW TO ${ordinal(target.stretch).toUpperCase()}!`); pSafe = clamp(pSafe + 0.35 - 0.7 * s, 0.05, 0.95); }
    const safe = Math.random() < pSafe;
    const durR = 1.5, durB = safe ? durR + 0.2 : durR - 0.28, bp = BASES[target.stretch % 4], tCall = Math.max(durR, durB) + 0.03;
    const tws2 = [ballTo(bp, 0.1, 0.1 + durB, 8, 4, 4), moveTo(coverFor(target.stretch), bp, 0, 0.8)];
    const ev2 = callEvents(tCall, safe, bp, target.id);
    ev2.push({ t: durR - 0.35, slide: target.id });
    for (const g of goers) {
      tws2.push({ id: g.id, pts: [BASES[g.stretch % 4]], t0: 0, t1: g === target ? durR : durR * 0.9 });
      if (g.stretch === 4 && (g !== target || safe)) ev2.push({ t: g === target ? tCall + 0.1 : durR * 0.9, hide: g.id, text: g === target ? null : 'RUN!', at: BASES[0], color: '#ffd166' });

    else ev2.push({ t: tCall, crowd: ['cheer', 0.5] });

  }
  for (const p of plan) {
    if (p === outRunner) continue;

  res.hit = outRunner === plan[0] ? k : bFinal;
  res.text = ['', 'SINGLE!', 'DOUBLE!', 'TRIPLE!', 'INSIDE-THE-PARK HR!'][res.hit];
  if (outRunner) {
    res.sub = outRunner === plan[0] ? `${['', 'Singled', 'Doubled', 'Tripled'][k]}, then thrown out going for more` : `${res.text.replace('!', '')} — but the runner was thrown out at ${baseName(outRunner.stretch)}`;

  }

  return res;
}

// ---------- fly outs: tag up! ----------
function* tagUps(L, f, outText, fid) {
  const off = offTeam(), def = defTeam();
  const res = { outs: 1, runs: 0, bases: G.bases.slice(), hit: 0, text: outText };
  if (G.outs + 1 >= 3) return res;
  const thrT = b => { const d = dist(L, BASES[b % 4]); return d / f.arm + 0.35 + (d > 220 ? 0.5 : 0); };
  const cand = [];
  const r3 = G.bases[2], r2 = G.bases[1];
  if (r3) cand.push({ id: 'R3', from: 3, to: 4, pl: r3, delta: thrT(4) - (0.35 + 90 / runSpeed(r3, off)) });

  let goers = [];
  const c3 = cand.find(c => c.id === 'R3');
  if (c3 && c3.delta > -0.7) {
    const p0 = clamp(0.5 + c3.delta * 1.4, 0.06, 0.95);
    let go;

    else go = off.human ? true : p0 > 0.5 + Math.random() * 0.12;

  }
  const c2 = cand.find(c => c.id === 'R2');
  if (c2 && c2.delta > 0.15 && (!r3 || goers.includes(c3))) goers.push(c2);
  if (!goers.length) return res;
  const target = goers[0];
  let pSafe = clamp(0.5 + target.delta * 1.4, 0.06, 0.95);
  if (def.human) { const s = yield promptTiming(fid, target.to === 4 ? 'THROW HOME!' : 'THROW TO 3RD!'); pSafe = clamp(pSafe + 0.35 - 0.7 * s, 0.05, 0.95); }
  const safe = Math.random() < pSafe;
  const durR = 1.6, durB = safe ? durR + 0.2 : durR - 0.28, bp = BASES[target.to % 4], tCall = Math.max(durR, durB) + 0.03;

    if (g.to === 4) { res.runs++; ev.push({ t: tCall + 0.1, hide: g.id }); } else res.bases[g.to - 1] = g.pl;
  }
  if (res.runs && G.outs + res.outs >= 3 && target.to === 4) res.runs = 0;
  if (res.runs) res.text = 'SAC FLY!';
  else if (!safe) { res.text = 'DOUBLE PLAY!'; res.sub = 'Thrown out tagging up'; res.color = '#ff8a8a'; }
  yield anim(tws, tCall + 0.6, ev, [tCall - 0.55, tCall + 0.12]);
  return res;
}

// ---------- steals and pickoffs ----------
function* stealGen(from) {

// ================= Game over =================
function gameOver() {
  G.phase = 'over'; G.banner = null;
  if (G.opts.auto) return;
  Sound.stopCrowd();
  hud(false);
  const me = G.teams.findIndex(t => t.isP1);
  const myScore = G.score[me], theirScore = G.score[1 - me];
  const won = myScore > theirScore, tie = myScore === theirScore;
  const rewards = [];
  if (G.opts.mode === 'cpu') {
    const mult = DIFF[G.opts.diff].mult;
    rewards.push(['Played a game', 30]);
    if (won) rewards.push([`Win on ${DIFF[G.opts.diff].label}`, Math.round(50 * mult)]);
    if (tie) rewards.push(['Tie game', 15]);
    const st = G.stats[me], k = G.stats[me].k;
    if (st.h) rewards.push([`${st.h} hit${st.h > 1 ? 's' : ''} × 5`, st.h * 5]);
    if (st.hr) rewards.push([`${st.hr} home run${st.hr > 1 ? 's' : ''} × 20`, st.hr * 20]);
    if (k) rewards.push([`${k} strikeout${k > 1 ? 's' : ''} by your pitcher × 5`, k * 5]);
    const total = rewards.reduce((s, r) => s + r[1], 0);
    save.coins += total;
    if (won) save.record.w++; else if (tie) save.record.t++; else save.record.l++;
    persist();
    if (total) Sound.coin();
  }
  if (won || G.opts.mode !== 'cpu') Sound.cheer(true);
  showGameOver(won, tie, rewards);
}

// ================= Main loop =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const dts = testMode && window.__slugger && window.__slugger.speed ? dt * window.__slugger.speed : dt;
  if (G && !G.paused && G.phase !== 'over' && G.phase !== 'trivia') { update(dts); syncUI(false); }
  updateFieldCam(dt, false);
  render();
  requestAnimationFrame(frame);
}
resize();
updateFieldCam(0, true);
showTitle();
requestAnimationFrame(frame);

// Offline support: register the service worker only when served over https (e.g. GitHub Pages).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline caching unavailable */ }); });
}

// Test hook (only with ?test in the URL): simulate computer-vs-computer games quickly.
if (testMode) {
  window.__slugger = {
    simulate(n, innings, diff, simHuman, help) {
      const out = [];
      if (help) save.settings.help = help;
      for (let g = 0; g < n; g++) {
        G = newGame({ mode: 'cpu', innings: innings || 9, diff: diff || 'medium', userHome: false, auto: true, simHuman });
        banner('', '', 0.01, startAtBat);
        let steps = 0;
        while (G.phase !== 'over' && steps < 600000) { update(1 / 30); steps++; }
        out.push({ tally: G.tally, score: G.score.slice(), stats: G.stats, innings: G.inning, steps, over: G.phase === 'over' });
      }
      G = null; return out;
    },
    state: () => G,
    start: o => startGame(o),
    tap: (x, y) => onTap({ x, y }),
    save: () => save,
    trivia: i => showTrivia(TRIVIA[i], () => {}),
    unlock: () => { Sound.unlock(); Sound.startCrowd(); },
    P3: (x, y, z) => P3(x, y, z),
    spots: () => (G && G.play && G.play.prompt && G.play.prompt.kind === 'throwChoice') ? throwChoiceSpots(G.play.prompt) : null
  };
}

})();
</script>
