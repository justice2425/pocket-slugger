// Uses ONLY voices built into the device (never an online voice), skips Apple's joke/novelty voices,
// speaks at a natural pitch and speed, and doesn't chop words off mid-sentence.

  if (def.human && opts.length > 1) {
    const base = yield { prompt: { kind: 'throwChoice', title: 'Where do you throw?', options: opts.map(o => ({ base: o.base })).sort((a, b) => b.base - a.base) } };
    ch = opts.find(o => o.base === base) || best();
  } else ch = def.human ? opts[0] : best();
  let out;
  if (ch.margin > 0.35) out = true;
  else if (ch.margin < -0.35) out = false;
  else {
    let p = clamp(0.5 + ch.margin * 1.4, 0.05, 0.95);
    if (def.human) { const s = yield promptTiming(fid, 'THROW!'); p = clamp(0.12 + 0.8 * s + ch.margin * 0.5, 0.03, 0.97); }
    out = Math.random() < p;
  }
  // Double play? After a force out somewhere else, relay to first.
  let dp = false;
  const bat = runners[0];
  if (out && ch.base !== 1 && ch.r.forced && G.outs + 1 < 3) {
    const pivot = fielderStats(ch.base === 2 ? (['SS', '3B', 'P'].includes(fd.pos) ? '2B' : 'SS') : ch.base === 3 ? '3B' : 'C');
    const tRelay = ch.tThrow + 0.8 + dist(BASES[ch.base % 4], BASES[1]) / pivot.arm, m2 = bat.t - tRelay;
    if (m2 > 0.3) dp = true;
    else if (m2 > -0.3) {
      let p = clamp(0.4 + m2 * 1.3, 0.05, 0.95);
      if (def.human) { const s = yield promptTiming(coverFor(ch.base), 'TURN TWO!'); p = clamp(0.1 + 0.8 * s + m2 * 0.5, 0.03, 0.97); }
      dp = Math.random() < p;
    }
  }
  if (dp && isMine(def)) earnBadge('dp');
  // Stage B: the throw(s)
  const tws2 = [], ev2 = [];
  const bp = BASES[ch.base % 4], tOff = fd.t;
  let tArr = Math.max(0.25, ch.tThrow - tOff);
  let tR = Math.max(0.15, ch.r.t - tOff);
  if (out) tArr = Math.min(tArr, tR - 0.12); else tR = Math.min(tR, tArr - 0.12);
  tArr = Math.max(0.2, tArr); tR = Math.max(0.15, tR);
  if (ch.self) { tws2.push(moveTo(fid, bp, 0, tArr)); tws2.push(ballTo(bp, 0, tArr, 0, 4, 4)); }
  else {
    tws2.push(ballTo(bp, Math.min(0.3, tArr - 0.1), tArr, 3, 4, 4));
    const cov = coverFor(ch.base) === fid ? (ch.base === 1 ? 'F_P' : 'F_2B') : coverFor(ch.base);
    tws2.push(moveTo(cov, bp, 0, Math.min(0.6, tArr)));
  }
  const close = Math.abs(ch.margin) < 0.35;
  const tCall = Math.max(tArr, tR) + 0.02;
  ev2.push(...callEvents(tCall, !out, bp, ch.r.id));
  if (close && ch.r.id !== 'R0') ev2.push({ t: Math.max(0, tR - 0.3), slide: ch.r.id });
  let slow = close ? [tCall - 0.5, tCall + 0.12] : null;
  const res = { outs: out ? 1 : 0, runs: 0, bases: [null, null, null], hit: 0 };
  let outTime = out ? tCall : Infinity;
  if (dp) {
    const tDP = tCall + 0.7, tB = Math.max(tDP + 0.12, bat.t - tOff);
    tws2.push(ballTo(BASES[1], tCall + 0.1, tDP, 3, 4, 4)); tws2.push(moveTo('F_1B', BASES[1], 0, 0.6));
    ev2.push(...callEvents(tDP, false, BASES[1], 'R0'));
    tws2.push(moveTo('R0', BASES[1], 0, tB));
    res.outs = 2; outTime = tDP;
  } else if (ch.r.id !== 'R0') tws2.push(moveTo('R0', BASES[1], 0, Math.max(0.15, bat.t - tOff)));
  else tws2.push(moveTo('R0', BASES[1], 0, tR));
  for (const r of runners) {
    if (r === ch.r && out) continue;
    if (r.id === 'R0' && dp) continue;
    if (r.id === 'R0') { res.bases[0] = batter; continue; }
    const tw = r === ch.r ? moveTo(r.id, bp, 0, tR) : runTw(r.id, r.from, r.to, 0.05, runSpeed(r.pl, off));
    if (tw) tws2.push(tw);
    if (r.to === 4) { res.runs++; r.scoreT = tw ? tw.t1 : 0; ev2.push({ t: r.scoreT, hide: r.id, text: 'RUN!', at: BASES[0], color: '#ffd166' }); }
    else res.bases[r.to - 1] = r.pl;
  }
  if (G.outs + res.outs >= 3) {
    const forceOut = ch.r.forced || dp;
    if (forceOut) res.runs = 0;
    else res.runs = runners.filter(r => r.to === 4 && r !== ch.r && r.scoreT != null && r.scoreT < outTime).length;
  }
  if (dp) { res.text = 'DOUBLE PLAY!'; res.color = '#ff8a8a'; }
  else if (ch.base === 1) {
    if (out) res.text = bunt && runners.length > 1 ? 'SACRIFICE BUNT!' : 'GROUND OUT';
    else { res.text = bunt ? 'BUNT SINGLE!' : 'INFIELD HIT!'; res.hit = 1; }
    if (out && bunt && runners.length > 1) res.sub = 'The runner moves up — nice sacrifice!';
  } else res.text = out ? "FIELDER'S CHOICE" : 'EVERYONE’S SAFE!';
  yield anim(tws2, maxT(tws2) + 0.5, ev2, slow);
  return res;
}

// ---------- hits: runners advance; players can send runners and pick where to throw ----------
function* hitRunning(c) {
  const off = offTeam(), def = defTeam(), batter = curBatter();
  const el = c.elapsed || 0;
  const thr = n => dist(c.P, BASES[n % 4]) / c.f.arm + 0.3 + (n === 4 ? 1.2 : n >= 2 ? 1.7 + (n >= 3 ? 0.6 : 0) : 0);
  const head = from => from === 0 ? 0.7 : (G.headStart === from ? -0.5 : 0.3);
  const tRun = (pl, from, n) => head(from) + 90 * (n - from) / runSpeed(pl, off) + 0.1 * Math.max(0, n - from - 1) - el;
  const margin = (pl, from, n) => (c.tRet + thr(n)) - tRun(pl, from, n);
  // batter first
  let k = 1;
  while (k < 3 && margin(batter, 0, k + 1) > 0.25) k++;
  const plan = [{ id: 'R0', from: 0, pl: batter, safe: k }];
  let behind = k;
  for (let i = 0; i < 3; i++) {
    const r = G.bases[i]; if (!r) continue;
    const from = i + 1, min = Math.min(4, Math.max(from + 1, behind + 1));
    let safe = min;
    while (safe < 4 && margin(r, from, safe + 1) > 0.25) safe++;
    plan.push({ id: 'R' + from, from, pl: r, safe });
    behind = safe;
  }
  // can anyone try for one more base?
  for (let j = 0; j < plan.length; j++) {
    const p = plan[j], n = p.safe + 1;
    if (n > 4) continue;
    const ahead = plan.slice(j + 1).find(q => q.safe < 4);
    if (ahead && ahead.safe <= n) continue;
    const delta = margin(p.pl, p.from, n);
    if (delta > -0.55) { p.stretch = n; p.delta = delta; }
  }
  const tws = c.ballTws.slice(), ev = (c.preEvents || []).slice();
  tws.push(moveTo(c.fid, c.P, 0.05, Math.max(0.3, c.tRet - 0.3)));
  for (const p of plan) {
    const tw = runTw(p.id, p.from, p.safe, p.from === 0 ? Math.max(0, 0.9 - el) : 0, runSpeed(p.pl, off));
    if (tw) tws.push(tw);
    if (p.safe === 4) ev.push({ t: tw ? tw.t1 : 0.5, hide: p.id, text: 'RUN!', at: BASES[0], color: '#ffd166', crowd: ['cheer', 0.4] });
  }
  ev.push({ t: 0.3, crowd: ['cheer', 0.25] });
  yield anim(tws, Math.max(c.tRet, maxT(tws)) + 0.25, ev);

  // Decisions
  const cands = plan.filter(p => p.stretch);
  let goers = [];
  if (cands.length) {
    if (off.human) {
      const key = cands.reduce((a, b) => (b.from > a.from ? b : a));
      const p0 = clamp(0.5 + key.delta * 1.5, 0.08, 0.92);
      const title = key.from === 0 ? (key.stretch === 4 ? 'Try for HOME?!' : `Go for ${ordinal(key.stretch)}?`) : (key.stretch === 4 ? 'Send the runner HOME?' : `Send the runner to ${ordinal(key.stretch)}?`);
      const go = yield { prompt: { kind: 'choice', title, sub: p0 > 0.6 ? 'Good chance!' : p0 > 0.4 ? 'Close call…' : 'Risky!' } };
      if (go) goers.push(key);
      for (const p of cands) if (p !== key && p.delta > 0.05) goers.push(p);
    } else for (const p of cands) { const p0 = clamp(0.5 + p.delta * 1.5, 0.08, 0.92); if (p0 > 0.5 + Math.random() * 0.15) goers.push(p); }
    // no passing: a runner can only go if the base isn't held by someone ahead who's staying
    for (let j = plan.length - 1; j >= 0; j--) {
      const p = plan[j]; if (!goers.includes(p)) continue;
      const ahead = plan.slice(j + 1).find(q => (goers.includes(q) ? q.stretch : q.safe) < 4);
      if (ahead && (goers.includes(ahead) ? ahead.stretch : ahead.safe) <= p.stretch) goers = goers.filter(g => g !== p);
    }
  }
  const res = { outs: 0, runs: 0, bases: [null, null, null], hit: k };
  const finals = new Map(plan.map(p => [p, p.safe]));
  let outRunner = null;
  if (goers.length) {
    let target;
    if (def.human && goers.length > 1) {
      const base = yield { prompt: { kind: 'throwChoice', title: 'Throw to which base?', options: goers.map(g => ({ base: g.stretch })).sort((a, b) => b.base - a.base) } };
      target = goers.find(g => g.stretch === base) || goers[0];
    } else if (def.human) target = goers[0];
    else target = goers.reduce((a, b) => (b.delta < a.delta ? b : a));
    let pSafe = clamp(0.5 + target.delta * 1.5, 0.08, 0.92);
    if (def.human) { const s = yield promptTiming(c.fid, target.stretch === 4 ? 'THROW HOME!' : `THROW TO ${ordinal(target.stretch).toUpperCase()}!`); pSafe = clamp(pSafe + 0.35 - 0.7 * s, 0.05, 0.95); }
    const safe = Math.random() < pSafe;
    const durR = 1.5, durB = safe ? durR + 0.2 : durR - 0.28, bp = BASES[target.stretch % 4], tCall = Math.max(durR, durB) + 0.03;
    const tws2 = [ballTo(bp, 0.1, 0.1 + durB, 8, 4, 4), moveTo(coverFor(target.stretch), bp, 0, 0.8)];
    const ev2 = callEvents(tCall, safe, bp, target.id);
    ev2.push({ t: durR - 0.35, slide: target.id });
    for (const g of goers) {
      tws2.push({ id: g.id, pts: [BASES[g.stretch % 4]], t0: 0, t1: g === target ? durR : durR * 0.9 });
      if (g.stretch === 4 && (g !== target || safe)) ev2.push({ t: g === target ? tCall + 0.1 : durR * 0.9, hide: g.id, text: g === target ? null : 'RUN!', at: BASES[0], color: '#ffd166' });
      finals.set(g, g.stretch);
    }
    if (!safe) { outRunner = target; res.outs = 1; }
    else ev2.push({ t: tCall, crowd: ['cheer', 0.5] });
    yield anim(tws2, tCall + 0.6, ev2, [tCall - 0.55, tCall + 0.12]);
  }
  for (const p of plan) {
    if (p === outRunner) continue;
    const b = finals.get(p);
    if (b === 4) res.runs++; else res.bases[b - 1] = p.pl;
  }
  const bFinal = finals.get(plan[0]);
  res.hit = outRunner === plan[0] ? k : bFinal;
  res.text = ['', 'SINGLE!', 'DOUBLE!', 'TRIPLE!', 'INSIDE-THE-PARK HR!'][res.hit];
  if (outRunner) {
    res.sub = outRunner === plan[0] ? `${['', 'Singled', 'Doubled', 'Tripled'][k]}, then thrown out going for more` : `${res.text.replace('!', '')} — but the runner was thrown out at ${baseName(outRunner.stretch)}`;
    res.text = `OUT at ${baseName(outRunner.stretch)}!`; res.color = '#ff8a8a';
  }
  if (!res.color && res.hit >= 2) res.color = '#ffd166';
  return res;
}

// ---------- fly outs: tag up! ----------
function* tagUps(L, f, outText, fid) {
  const off = offTeam(), def = defTeam();
  const res = { outs: 1, runs: 0, bases: G.bases.slice(), hit: 0, text: outText };
  if (G.outs + 1 >= 3) return res;
  const thrT = b => { const d = dist(L, BASES[b % 4]); return d / f.arm + 0.35 + (d > 220 ? 0.5 : 0); };
  const cand = [];
  const r3 = G.bases[2], r2 = G.bases[1];
  if (r3) cand.push({ id: 'R3', from: 3, to: 4, pl: r3, delta: thrT(4) - (0.35 + 90 / runSpeed(r3, off)) });
  if (r2) cand.push({ id: 'R2', from: 2, to: 3, pl: r2, delta: thrT(3) - (0.35 + 90 / runSpeed(r2, off)) });
  let goers = [];
  const c3 = cand.find(c => c.id === 'R3');
  if (c3 && c3.delta > -0.7) {
    const p0 = clamp(0.5 + c3.delta * 1.4, 0.06, 0.95);
    let go;
    if (off.human && p0 < 0.9) go = yield { prompt: { kind: 'choice', title: 'Tag up and run home?', sub: p0 > 0.6 ? 'Good chance — deep fly!' : p0 > 0.4 ? 'Close call…' : 'Risky — short fly ball!' } };
    else go = off.human ? true : p0 > 0.5 + Math.random() * 0.12;
    if (go) goers.push(c3);
  }
  const c2 = cand.find(c => c.id === 'R2');
  if (c2 && c2.delta > 0.15 && (!r3 || goers.includes(c3))) goers.push(c2);
  if (!goers.length) return res;
  const target = goers[0];
  let pSafe = clamp(0.5 + target.delta * 1.4, 0.06, 0.95);
  if (def.human) { const s = yield promptTiming(fid, target.to === 4 ? 'THROW HOME!' : 'THROW TO 3RD!'); pSafe = clamp(pSafe + 0.35 - 0.7 * s, 0.05, 0.95); }
  const safe = Math.random() < pSafe;
  if (!safe && isMine(def)) earnBadge('dp');
  const durR = 1.6, durB = safe ? durR + 0.2 : durR - 0.28, bp = BASES[target.to % 4], tCall = Math.max(durR, durB) + 0.03;
  const tws = [ballTo(bp, 0.15, 0.15 + durB, 10, 4, 6), moveTo(coverFor(target.to), bp, 0, 0.6)];
  const ev = callEvents(tCall, safe, bp, target.id); ev.push({ t: durR - 0.35, slide: target.id });
  for (const g of goers) {
    tws.push({ id: g.id, pts: [BASES[g.to % 4]], t0: 0.1, t1: g === target ? durR : durR * 0.95 });
    res.bases[g.from - 1] = null;
    if (g === target && !safe) { res.outs = 2; continue; }
    if (g.to === 4) { res.runs++; ev.push({ t: tCall + 0.1, hide: g.id }); } else res.bases[g.to - 1] = g.pl;
  }
  if (res.runs && G.outs + res.outs >= 3 && target.to === 4) res.runs = 0;
  if (res.runs) res.text = 'SAC FLY!';
  else if (!safe) { res.text = 'DOUBLE PLAY!'; res.sub = 'Thrown out tagging up'; res.color = '#ff8a8a'; }
  yield anim(tws, tCall + 0.6, ev, [tCall - 0.55, tCall + 0.12]);
  return res;
}

// ---------- steals and pickoffs ----------
function* stealGen(from) {
  const off = offTeam(), def = defTeam(), r = G.bases[from - 1];
  const c = fielderStats('C');
  let p = clamp(0.5 + 0.06 * (eff(off, r.spd) - 5) - 0.04 * (c.fld - 5) + (G.pitch && G.pitch.type !== 'FB' ? 0.08 : 0) - (from === 2 ? 0.06 : 0), 0.15, 0.92);
  const base = BASES[from], next = BASES[from + 1];
  const id = 'R' + from;
  yield anim([moveTo(id, lerpPt(base, next, 0.5), 0, 0.4), ballTo({ x: 0, y: -3 }, 0, 0.1, 0, 4, 4)], 0.4, []);
  if (def.human) { const s = yield promptTiming('F_C', 'THROW HIM OUT!'); p = clamp(p + 0.3 - 0.6 * s, 0.05, 0.95); }
  const safe = Math.random() < p;
  if (safe && isMine(off)) earnBadge('steal');
  if (!safe && isMine(def)) earnBadge('cannon');
  const cover = from === 1 ? (Math.random() < 0.5 ? 'F_SS' : 'F_2B') : 'F_3B';
  const durR = 1.0, durB = safe ? durR + 0.12 : durR - 0.15, tCall = Math.max(durR, durB) + 0.03;
  const tws = [moveTo(id, next, 0, durR), moveTo(cover, next, 0, 0.6), ballTo(next, 0.05, durB, 4, 2.5, 5)];
  const ev = callEvents(tCall, safe, next, id);
  ev.push({ t: durR - 0.35, slide: id }, { t: tCall, crowd: [safe === offTeam().human ? 'cheer' : 'ooh', 0.4] });
  yield anim(tws, tCall + 0.6, ev, [tCall - 0.5, tCall + 0.12]);
  G.bases[from - 1] = null;
  if (safe) G.bases[from] = r; else G.outs++;
  return { text: safe ? `Stole ${ordinal(from + 1)}! 🏃` : 'Caught stealing!' };
}
function* pickoffGen(from) {
  const off = offTeam(), def = defTeam(), r = G.bases[from - 1];
  const intent = !!(G.cpuStealIntent && G.cpuStealIntent.from === from);
  const p = intent ? clamp(0.35 + 0.03 * (eff(def, def.pitcher.ctl) - 5) - 0.03 * (eff(off, r.spd) - 5), 0.15, 0.6) : clamp(0.05 + 0.01 * (def.pitcher.ctl - 5), 0.02, 0.1);
  const out = Math.random() < p, id = 'R' + from, base = BASES[from], next = BASES[from + 1];
  yield anim([moveTo(id, lerpPt(base, next, intent ? 0.17 : 0.09), 0, 0.3), ballTo(G.fpos.P, 0, 0.1, 0, 5, 5)], 0.35, []);
  const cover = from === 1 ? 'F_1B' : 'F_SS';
  const tCall = 0.8;
  const tws = [moveTo(cover, base, 0, 0.35), ballTo(base, 0.2, out ? 0.62 : 0.78, 2, 2, 5), moveTo(id, base, 0.25, out ? 0.95 : 0.65)];
  const ev = callEvents(tCall, !out, base, id); ev.push({ t: 0.3, dive: id });
  yield anim(tws, tCall + 0.6, ev, [0.45, 0.9]);
  let held = false;
  if (out) { G.bases[from - 1] = null; G.outs++; if (isMine(def)) earnBadge('pickoff'); }
  else if (intent && Math.random() < 0.6) held = true;
  return { text: out ? 'PICKED OFF!' : 'Safe — back to the bag', sub: held ? 'The runner is staying close now.' : '', held, out };
}
function startPickoff(from) {
  if (!G || G.phase !== 'pickPitch' || G.pickoffs >= 2) return;
  G.pickoffs++;
  startPlay(pickoffGen(from), res => {
    banner(res.text, res.sub, 1.4, () => {
      if (G.outs >= 3) endHalf();
      else { const held = res.held; nextPitch(); if (held) G.cpuStealIntent = null; }
    }, res.out ? '#ffd166' : '#fff');
  });
}

function tally(k) { if (testMode && G) { G.tally = G.tally || {}; G.tally[k] = (G.tally[k] || 0) + 1; } }
function finishPlay(res) {
  tally(res.type === 'foul' ? 'FOUL' : res.text);
  if (res.type === 'foul') {
    G.steal = null;
    if (res.bunt && G.strikes === 2) {
      G.strikes = 3; G.outs++; G.stats[1 - G.half].k++; umpire('Strike three!');
      return banner('STRIKEOUT!', 'A foul bunt with two strikes is strike three!', 2, endPA, '#ff8a8a');
    }
    if (G.strikes < 2) G.strikes++;
    umpire('Foul ball.', 0);
    return banner('FOUL BALL', '', 0.9, nextPitch, '#ffd166');
  }
  G.outs += res.outs || 0;
  G.bases = G.outs >= 3 ? [null, null, null] : res.bases;
  if (res.runs) addRuns(res.runs);
  if (res.hit) { G.stats[G.half].h++; if (res.hit === 4) G.stats[G.half].hr++; }
  if (res.hit && isMine(offTeam())) {
    const T = G.track; T['h' + res.hit] = (T['h' + res.hit] || 0) + 1; earnBadge('first_hit');
    if (res.hit === 4) { earnBadge('first_hr'); if (res.runs === 4) earnBadge('grand_slam'); if (T.h4 >= 3) earnBadge('three_hr'); }
    if (T.h1 && T.h2 && T.h3 && T.h4) earnBadge('cycle');
  }
  let sub = res.sub || '';
  if (res.runs) sub = (sub ? sub + ' · ' : '') + (res.runs === 1 ? '1 run scores!' : res.runs + ' runs score!');
  if (res.hit === 4) Voice.say(res.text === 'GRAND SLAM!' ? 'Grand slam!' : 'Home run!', 2);
  else if (res.hit >= 2) Voice.say(res.text.charAt(0) + res.text.slice(1).toLowerCase(), 0);
  banner(res.text || 'OUT', sub, res.hit === 4 ? 2.6 : 1.7, endPA, res.color);
}

// ================= Game over =================
function gameOver() {
  G.phase = 'over'; G.banner = null;
  if (G.opts.auto) return;
  Sound.stopCrowd();
  hud(false);
  const me = G.teams.findIndex(t => t.isP1);
  const myScore = G.score[me], theirScore = G.score[1 - me];
  const won = myScore > theirScore, tie = myScore === theirScore;
  const rewards = [];
  if (G.opts.mode === 'cpu') {
    const mult = DIFF[G.opts.diff].mult;
    rewards.push(['Played a game', 30]);
    if (won) rewards.push([`Win on ${DIFF[G.opts.diff].label}`, Math.round(50 * mult)]);
    if (tie) rewards.push(['Tie game', 15]);
    const st = G.stats[me], k = G.stats[me].k;
    if (st.h) rewards.push([`${st.h} hit${st.h > 1 ? 's' : ''} × 5`, st.h * 5]);
    if (st.hr) rewards.push([`${st.hr} home run${st.hr > 1 ? 's' : ''} × 20`, st.hr * 20]);
    if (k) rewards.push([`${k} strikeout${k > 1 ? 's' : ''} by your pitcher × 5`, k * 5]);
    const total = rewards.reduce((s, r) => s + r[1], 0);
    save.coins += total;
    if (won) save.record.w++; else if (tie) save.record.t++; else save.record.l++;
    persist();
    if (total) Sound.coin();
  }
  if (won) { if (G.walkoff && me === 1) earnBadge('walkoff'); if (G.opts.mode === 'cpu' && theirScore === 0 && G.opts.innings >= 3) earnBadge('shutout'); if (G.opts.mode === 'cpu' && G.opts.diff === 'hard') earnBadge('giant'); }
  if (G.opts.season) seasonRecord();
  if (won || G.opts.mode !== 'cpu') Sound.cheer(true);
  showGameOver(won, tie, rewards);
}

// ================= Canvas =================
const W = 1000, H = 700;

// A friendly cartoon kid. (x,y) = feet. ~70 units tall at s=1.
// Team logo: a simple shape with the team's letter (all original shapes).

}
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// A friendly cartoon kid. (x,y) = feet. ~70 units tall at s=1.
function drawKid(x, y, s, o) {

// ================= Stadium art (built once per stadium from a fixed seed) =================
const stadiumCache = {};

  rows.forEach(y => {
    const sc = 0.72 + (y - 170) / 116 * 0.5, fans = [];

    const ac = clamp(a, -45, 45), d0 = fenceAt(st, ac) + 18, w0 = wallAt(st, ac);
    for (let r = 0; r < 8; r++) {
      if (R() < 0.07) continue;
      const d = d0 + r * 10 + R() * 2, aa = a + R() * 1.5;
      ffans.push({ x: Math.sin(rad(aa)) * d, y: Math.cos(rad(aa)) * d, z: w0 + 4 + r * 6.2, shirt: rp(SHIRTS), skin: rp(SKIN), ph: R() * 6.28, team: R() < 0.32 });
    }
  }
  ffans.sort((p, q) => Math.hypot(q.x, q.y + 100) - Math.hypot(p.x, p.y + 100));
  // backdrop pieces (positions in 0..1 across the width)
  const bd = [];
  for (let i = 0; i < 26; i++) bd.push({ x: R(), w: 0.03 + R() * 0.06, h: 0.25 + R() * 0.75, c: R(), win: R() });
  return (stadiumCache[st.id] = { prow, ffans, bd, R });
}
// Draws what's beyond the stands (houses, bay, city, mountains…). baseY = where the stands start; xo = parallax offset.

function fanBob(f, clock, i) {

// ================= Pitch view (behind home plate) =================

// The ball's flight in practice: no fielders, just how far it goes.
function* derbyGen(bb) {
  const st = G.stadium, carry = st.carry || 1, hang = st.hang || 1;
  const v = bb.ev * 1.467, la = rad(bb.la), sp = rad(bb.spray);
  const dir = { x: Math.sin(sp), y: Math.cos(sp) }, foul = Math.abs(bb.spray) > 45;
  if (bb.la <= 10 || bb.bunt) {
    const s = clamp(v * 0.9, 30, 150), pt = { x: dir.x * s, y: dir.y * s };
    yield anim([ballTo(pt, 0, 1.3, 1.5, 0, 1)], 1.5, [{ t: 0.3, text: foul ? 'FOUL' : 'GROUNDER', color: '#fff' }]);
    return { hr: false, dist: 0, text: foul ? 'FOUL BALL' : 'GROUNDER', ev: bb.ev };
  }
  const T = Math.max(0.7, 2 * v * Math.sin(la) / 32.2 * 0.85) * hang;
  const D = Math.max(20, 0.72 * v * v * Math.sin(2 * la) / 32.2) * carry;
  const peak = Math.min(180, Math.pow(v * Math.sin(la), 2) / 64.4 * 0.75) * (hang > 1 ? 1.4 : 1);
  const fence = fenceDist(bb.spray), wall = wallAt(st, bb.spray);
  const hr = !foul && D > fence && hArc(fence / D, 3, 0, peak) > wall + 1;
  const offWall = !foul && !hr && D > fence;
  const end = offWall ? { x: dir.x * (fence - 1), y: dir.y * (fence - 1) } : { x: dir.x * D, y: dir.y * D };
  const tEnd = offWall ? T * fence / D : T;
  const ev = [];
  if (hr) ev.push({ t: Math.min(T * 0.5, 1.4), text: `${Math.round(D)} FT!`, color: '#ffd166', crowd: ['wave', 1] }, { t: T * 0.9, fireworks: D > 380 });
  else if (offWall) ev.push({ t: tEnd, text: 'OFF THE WALL!', at: end, sound: 'thud', crowd: ['ooh', 0.4] });
  else ev.push({ t: tEnd, sound: 'bounce', dust: end, text: foul ? 'FOUL' : `${Math.round(D)} ft`, at: end });
  yield anim([ballTo(end, 0, tEnd, offWall ? peak * (fence / D) * (fence / D) : peak, hr ? wall + 15 : (offWall ? hArc(fence / D, 3, 0, peak) : 0), 3)], tEnd + 0.4, ev);
  if (hr) return { hr: true, dist: Math.round(D), text: Math.round(D) >= 420 ? 'MOONSHOT!' : 'HOME RUN!', sub: `${Math.round(D)} feet`, ev: bb.ev };
  return { hr: false, dist: Math.round(D), text: foul ? 'FOUL BALL' : offWall ? 'OFF THE WALL!' : 'FLY BALL', sub: foul ? '' : `${Math.round(D)} feet`, ev: bb.ev };
}

// ---------- the timing meter (shown after every swing) ----------
function drawTimingMeter() {
  const m = G.meter, life = G.mode === 'game' ? 1.8 : 2.6;
  if (!m || m.t > life) return;
  const a = clamp((life - m.t) * 3, 0, 1);
  ctx.save(); ctx.globalAlpha = a;
  const cx = 500, y = H - 104, w = 420, hh = 16;
  ctx.fillStyle = 'rgba(15,23,42,.82)'; rr(cx - w / 2 - 18, y - 36, w + 36, 80, 16);
  const px = e => cx + clamp(e / (1.6 * m.W), -1, 1) * w / 2;
  ctx.fillStyle = '#ef4444'; rr(cx - w / 2, y - hh / 2, w, hh, 8);
  ctx.fillStyle = '#facc15'; ctx.fillRect(px(-m.W), y - hh / 2, px(m.W) - px(-m.W), hh);
  ctx.fillStyle = '#22c55e'; ctx.fillRect(px(-m.W * 0.22), y - hh / 2, px(m.W * 0.22) - px(-m.W * 0.22), hh);
  txt('EARLY', cx - w / 2 + 28, y - 22, 13, '#fecaca', 'center', 0);
  txt('LATE', cx + w / 2 - 24, y - 22, 13, '#fecaca', 'center', 0);
  txt('PERFECT', cx, y - 22, 13, '#bbf7d0', 'center', 0);
  const mx = px(m.e);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx - 9, y - hh / 2 - 9); ctx.lineTo(mx + 9, y - hh / 2 - 9); ctx.lineTo(mx, y - 1); ctx.closePath(); ctx.fill();
  ctx.fillRect(mx - 1.5, y - hh / 2, 3, hh);
  const ae = Math.abs(m.e), secs = (ae).toFixed(2);
  const msg = ae < m.W * 0.22 ? 'PERFECT timing!' : ae < m.W ? `A little ${m.e < 0 ? 'early' : 'late'} · ${secs} sec` : `Way ${m.e < 0 ? 'early' : 'late'} · ${secs} sec`;
  txt(msg, cx, y + 26, 18, ae < m.W * 0.22 ? '#ffd166' : '#fff', 'center', 0);
  ctx.restore();
}
function drawPracticeHUD() {
  const x = 14, y = 14;

    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: showTitle }, '← Done'))));
}

// ================= Create-a-player & uniform designer =================
function previewCanvas(w, hh, drawFn) {
  const c = h('canvas', { width: String(w * 2), height: String(hh * 2), class: 'preview', style: { width: w + 'px', height: hh + 'px' } });
  c.redraw = () => withCanvas(c, () => { ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, w, hh); drawFn(); });
  c.redraw();
  return c;
}
function previewBackdrop(w, hh) {
  const g = ctx.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#e0f2fe');
  ctx.fillStyle = g; rr(0, 0, w, hh, 14);
  ctx.fillStyle = '#4ade80'; ctx.fillRect(0, hh - 34, w, 34); ctx.fillStyle = '#c99060'; ell(w / 2, hh - 14, w * 0.42, 10);
}
function swatchRow(colors, get, set, labels) {
  const wrap = h('div', { class: 'row' });
  const render_ = () => wrap.replaceChildren(...colors.map((c, i) => h('button', { class: 'swatch' + (get() === i || get() === c ? ' sel' : ''), style: { background: c }, 'aria-label': labels ? labels[i] : 'color', onclick: () => { set(i, c); render_(); } })));
  render_(); return wrap;
}
function showPlayerEditor(pl, isPitcher) {
  const t = save.team, L = pl.look;
  const prev = previewCanvas(320, 200, () => {
    previewBackdrop(320, 200);
    drawKid(90, 182, 2.0, kidOpts(pl, t, { glove: true }));
    drawBatter(232, 188, 2.05, t, pl, 0, !isPitcher && pl.bats === 'L', false);
  });
  const upd = () => { persist(); prev.redraw(); };
  const numIn = h('input', { type: 'number', min: '0', max: '99', value: String(L.num), 'aria-label': 'jersey number', class: 'numin', oninput: e => { const v = Math.round(Number(e.target.value)); if (Number.isFinite(v)) { L.num = clamp(v, 0, 99); upd(); } } });
  showScreen(h('div', { class: 'card stack editor' },
    h('div', { class: 'row between' }, h('h2', { text: '✏️ Create-a-Player' }), h('span', { class: 'badge', style: { background: isPitcher ? '#111827' : t.color }, text: isPitcher ? 'P' : pl.pos })),
    h('div', { class: 'previewwrap' }, prev),
    h('div', { class: 'label', text: 'Name' }),
    h('input', { type: 'text', maxlength: '18', value: pl.name, 'aria-label': 'player name', oninput: e => { pl.name = cleanStr(e.target.value, pl.name, 18); upd(); } }),
    h('div', { class: 'row' }, h('div', { class: 'label', text: 'Jersey number' }), numIn,
      h('div', { class: 'label', style: { marginLeft: '12px' }, text: isPitcher ? 'Throws' : 'Bats' }),
      seg([['R', 'Right'], ['L', 'Left']], () => isPitcher ? pl.throws : pl.bats, v => { if (isPitcher) pl.throws = v; else pl.bats = v; upd(); })),
    h('div', { class: 'label', text: 'Skin tone' }), swatchRow(SKIN, () => L.skin, i => { L.skin = i; upd(); }),
    h('div', { class: 'label', text: 'Hair color' }), swatchRow(HAIR, () => L.hair, i => { L.hair = i; upd(); }),
    h('div', { class: 'label', text: 'Hair style' }), seg(HAIR_STYLES.map(s => [s, HAIR_STYLE_LABEL[s]]), () => L.style, v => { L.style = v; upd(); }),
    h('div', { class: 'label', text: 'Gear' }), seg(ACCS.map(a => [a, ACC_LABEL[a]]), () => L.acc, v => { L.acc = v; upd(); }),
    h('div', { class: 'row', style: { justifyContent: 'center', marginTop: '6px' } }, h('button', { class: 'btn green', onclick: showTeam }, 'Done ✓'))));
}
function uniformDesigner(onChange) {
  const t = save.team, u = t.uni;
  const prev = previewCanvas(330, 200, () => {
    previewBackdrop(330, 200);
    drawKid(80, 182, 2.0, kidOpts(t.batters[0], t, { glove: true }));
    drawBatter(240, 188, 2.05, t, t.batters[1], 0, false, false);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; circle(165, 46, 30); drawLogo(u, 165, 46, 22, t.color);
  });
  const upd = () => { persist(); prev.redraw(); if (onChange) onChange(); };
  const letterIn = h('input', { type: 'text', maxlength: '1', value: u.letter, class: 'numin', 'aria-label': 'logo letter', oninput: e => { const v = e.target.value; if (/^[A-Za-z0-9]$/.test(v)) { u.letter = v.toUpperCase(); upd(); } } });
  const box = h('div', { class: 'stack uniform' },
    h('div', { class: 'previewwrap' }, prev),
    h('div', { class: 'label', text: 'Main color' }), colorPicker(() => t.color, c => { t.color = c; upd(); }),
    h('div', { class: 'label', text: 'Trim color (numbers, stripes, logo)' }), swatchRow(SECONDARY, () => u.secondary, (i, c) => { u.secondary = c; upd(); }),
    h('div', { class: 'label', text: 'Jersey style' }), seg(UNI_STYLES.map(s => [s, UNI_STYLE_LABEL[s]]), () => u.style, v => { u.style = v; upd(); }),
    h('div', { class: 'label', text: 'Pants' }), seg([['white', 'White'], ['gray', 'Gray'], ['dark', 'Dark']], () => u.pants, v => { u.pants = v; upd(); }),
    h('div', { class: 'label', text: 'Cap logo' }), seg(LOGOS.map(l => [l, LOGO_LABEL[l]]), () => u.logo, v => { u.logo = v; upd(); }),
    h('div', { class: 'row' }, h('div', { class: 'label', text: 'Logo letter' }), letterIn));
  return box;
}

// ================= Main loop =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const dts = testMode && window.__slugger && window.__slugger.speed ? dt * window.__slugger.speed : dt;
  if (G && !G.paused && G.phase !== 'over' && G.phase !== 'trivia') { update(dts); syncUI(false); }
  updateFieldCam(dt, false);
  render();
  requestAnimationFrame(frame);
}
save = loadSave();
persist();
Voice.init();
resize();
updateFieldCam(0, true);
showTitle();
requestAnimationFrame(frame);

// Offline support: register the service worker only when served over https (e.g. GitHub Pages).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline caching unavailable */ }); });
}

// Test hook (only with ?test in the URL): simulate computer-vs-computer games quickly.
if (testMode) {
  window.__slugger = {
    simulate(n, innings, diff, simHuman, help) {
      const out = [];
      if (help) save.settings.help = help;
      for (let g = 0; g < n; g++) {
        G = newGame({ mode: 'cpu', innings: innings || 9, diff: diff || 'medium', userHome: false, auto: true, simHuman });
        banner('', '', 0.01, startAtBat);
        let steps = 0;
        while (G.phase !== 'over' && steps < 600000) { update(1 / 30); steps++; }
        out.push({ tally: G.tally, score: G.score.slice(), stats: G.stats, innings: G.inning, steps, over: G.phase === 'over' });
      }
      G = null; return out;
    },
    state: () => G,
    start: o => startGame(o),
    tap: (x, y) => onTap({ x, y }),
    save: () => save,
    async renderSound(name, dur, arg) {
      const sr = 22050, oc = new OfflineAudioContext(1, Math.ceil(sr * dur), sr);
      const keep = {}; for (const k of ['ctx', 'master', 'white', 'pink', 'crowdOn', 'crowdGain', 'crowdNodes']) keep[k] = Sound[k];
      Sound.crowdOn = false; Sound.setup(oc);
      try { if (name === 'crowd') { Sound.startCrowd(); Sound.setCrowd(arg); } else Sound[name](arg); }
      catch (e) { Object.assign(Sound, keep); return { error: String(e) }; }
      const buf = await oc.startRendering();
      Object.assign(Sound, keep);
      return Array.from(buf.getChannelData(0), x => Math.round(x * 32767));
    },
    trivia: i => showTrivia(TRIVIA[i], () => {}),
    unlock: () => { Sound.unlock(); Sound.startCrowd(); },
    P3: (x, y, z) => P3(x, y, z),
    derbyRate(stadium, sd, n) {
      G = newPractice('derby', stadium); G.derby = { players: [{ idx: 0, hr: 0, long: 0, swings: 0 }], cur: 0, per: 10 }; G.idx[0] = 0;
      let hr = 0, cnt = 0;
      for (let i = 0; i < n; i++) {
        G.pitch = coachPitch(); G.pitch.t = G.pitch.T; G.swing = null;
        doSwing({ e: gauss() * sd, cx: 0, cy: 2.5 }); cnt++;
        if (!G.swing.contact) continue;
        G.scene = { actors: { ball: { x: 0, y: 0, h: 3 } }, texts: [] };
        const gen = derbyGen(G.swing.bb); let r = gen.next(); while (!r.done) r = gen.next();
        if (r.value.hr) hr++;
      }
      G = null; return hr / cnt;
    },
    seasonSimAll: () => { const s = save.season; while (s && s.phase !== 'done') { if (!seasonNextGame(s)) break; simulateMyGame(); } return save.season; },
    spots: () => (G && G.play && G.play.prompt && G.play.prompt.kind === 'throwChoice') ? throwChoiceSpots(G.play.prompt) : null
  };
}

})();
